<style>
:root {
  --bg: #F8F7F3;
  --bg-gradient: radial-gradient(circle at 50% 0%, #FFFFFF 0%, #F5F3EC 100%);
  --ink: #0F1015;
  --ink-secondary: #272832;
  --muted: #565662;
  --card: #FFFFFF;
  --line: #E6E4DC;
  --yellow: #FFD23F;
  --yellow-hover: #F5C62C;
  --green: #15803D;
  --green-bg: #DCFCE7;
  --green-border: #86EFAC;
  --radius-card: 24px;
  --radius-pill: 9999px;
  --shadow-card: 0 16px 36px rgba(15, 16, 21, 0.07), 0 3px 8px rgba(15, 16, 21, 0.03);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--ink);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 24px 16px;
  overflow-x: hidden;
}

/* Ambient background glow */
body::before {
  content: "";
  position: fixed;
  top: -100px;
  right: 0;
  width: min(500px, 90vw);
  height: min(500px, 90vh);
  background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(255, 210, 63, 0.08) 45%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.header {
  position: relative;
  z-index: 1;
  padding: 8px 0 20px;
  text-align: center;
  width: 100%;
}

.logo-img {
  height: 42px;
  width: auto;
  max-width: 200px;
  object-fit: contain;
}

.main-container {
  position: relative;
  z-index: 1;
  max-width: 520px;
  width: 100%;
  margin: auto;
}

.thankyou-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: 42px 36px 36px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.check-bubble {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: var(--green-bg);
  border: 2px solid var(--green-border);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 18px;
  color: var(--green);
  box-shadow: 0 8px 24px rgba(34, 197, 94, 0.18);
  animation: popScale 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes popScale {
  0% { transform: scale(0.4); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.check-bubble svg {
  width: 28px;
  height: 28px;
}

.kicker {
  display: block;
  width: 100%;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: var(--green);
  text-transform: uppercase;
  margin: 0 auto 12px;
  text-align: center;
}

.title {
  display: block;
  width: 100%;
  font-size: clamp(1.4rem, 4.5vw, 1.95rem);
  font-weight: 800;
  line-height: 1.28;
  color: var(--ink);
  margin: 0 auto 14px;
  letter-spacing: -0.02em;
  text-align: center;
}

.desc {
  display: block;
  font-size: clamp(0.92rem, 2.5vw, 1.02rem);
  color: var(--muted);
  line-height: 1.6;
  max-width: 440px;
  margin: 0 auto 28px;
  text-align: center;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  max-width: 320px;
  background: var(--yellow);
  color: var(--ink);
  font-family: inherit;
  font-size: 0.98rem;
  font-weight: 800;
  padding: 15px 24px;
  border-radius: var(--radius-pill);
  text-decoration: none;
  box-shadow: 0 10px 24px rgba(255, 210, 63, 0.35);
  transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
  border: none;
}

.back-btn:hover {
  background: var(--yellow-hover);
  transform: translateY(-2px);
  box-shadow: 0 14px 28px rgba(255, 210, 63, 0.45);
}

.back-btn:active {
  transform: translateY(0);
}

.footer {
  position: relative;
  z-index: 1;
  padding: 20px 0 10px;
  text-align: center;
  font-size: 0.82rem;
  color: var(--muted);
  width: 100%;
}

@media (max-width: 480px) {
  body {
    padding: 16px 14px;
  }
  .thankyou-card {
    padding: 32px 20px 28px;
    border-radius: 20px;
  }
  .check-bubble {
    width: 56px;
    height: 56px;
    margin-bottom: 14px;
  }
  .check-bubble svg {
    width: 24px;
    height: 24px;
  }
  .desc {
    margin-bottom: 24px;
  }
  .back-btn {
    max-width: 100%;
    padding: 14px 20px;
  }
}
</style>
</head>
<body>

<header class="header">
  <a href="/" aria-label="Go to Homepage">
    <img src="https://dedicated-marketing-support.vercel.app/assets/ogs_logo.png" alt="OSK Growth Studio Logo" class="logo-img" onerror="this.onerror=null;this.src='assets/ogs_logo.png';">
  </a>
</header>

<main class="main-container">
  <div class="thankyou-card">
    <div class="check-bubble" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <span class="kicker">REQUEST RECEIVED · OSK GROWTH STUDIO</span>
    <h1 class="title">Your Next Stage of Growth Starts Here.</h1>
    <p class="desc">
      Thank you for choosing OSK Growth Studio. We have safely received your details and our team is already reviewing your brand's growth opportunities.
    </p>

    <a href="/" class="back-btn">
      <span>← Return to Homepage</span>
    </a>
  </div>
</main>

<footer class="footer">
  © 2026 OSK Growth Studio. All rights reserved.
</footer>

</body>
</html>
